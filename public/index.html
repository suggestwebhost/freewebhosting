<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Launch Your Free Website</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; }
        button { background: #238636; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #status { font-weight: bold; color: #555; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>True Multi-Page Web Host</h2>
    
    <label>Give your website a unique name:</label>
    <input type="text" id="repoName" placeholder="e.g., my-portfolio-site">

    <label>Select files (Must include index.html):</label>
    <input type="file" id="filePicker" multiple>

    <button onclick="startDeployment()">Deploy Website</button>
    <div id="status"></div>

    <script>
        async function startDeployment() {
            const rawName = document.getElementById('repoName').value.trim();
            const repoName = rawName.toLowerCase().replace(/[^a-z0-9-_]/g, '-');
            const fileInput = document.getElementById('filePicker').files;
            const statusDiv = document.getElementById('status');

            if (!repoName || fileInput.length === 0) {
                statusDiv.innerText = "❌ Please enter a name and pick files.";
                return;
            }

            statusDiv.innerText = "🏗️ Preparing files...";

            try {
                // Convert all files to base64 structure arrays
                const filesArray = [];
                for (let i = 0; i < fileInput.length; i++) {
                    const file = fileInput[i];
                    const base64Data = await toBase64(file);
                    filesArray.push({ name: file.name, content: base64Data });
                }

                statusDiv.innerText = "🚀 Sending securely to platform server...";

                // Send data to your hidden Vercel serverless function
                const response = await fetch('/api/deploy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repoName, files: filesArray })
                });

                const result = await response.json();

                if (!response.ok) throw new Error(result.error);

                statusDiv.innerHTML = `🎉 <strong>Success!</strong> Site live at:<br><a href="${result.url}" target="_blank">${result.url}</a>`;

            } catch (err) {
                statusDiv.innerText = `❌ Error: ${err.message}`;
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // Extracted pure base64 raw string
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
